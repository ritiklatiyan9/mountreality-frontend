<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28304a"/>
      <stop offset="0.45" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#10131d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ea0d6" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6d7cb4" stop-opacity="0.12"/>
