      <stop offset="1" stop-color="#242c44"/>
    </linearGradient>
    <linearGradient id="d2" x1="0" y1="740" x2="0" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d4766"/>
      <stop offset="1" stop-color="#1f2739"/>
    </linearGradient>
    <linearGradient id="d3" x1="0" y1="900" x2="0" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#454263"/>
      <stop offset="1" stop-color="#211f33"/>
    </linearGradient>
    <linearGradient id="d4" x1="0" y1="1020" x2="0" y2="1600" gradientUnits="userSpaceOnUse">
