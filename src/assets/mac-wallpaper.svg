      <stop offset="0.72" stop-color="#060810" stop-opacity="0"/>
      <stop offset="1" stop-color="#060810" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="b16" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="2560" height="1600" fill="url(#sky)"/>

  <!-- soft glow, top right -->
  <ellipse cx="1980" cy="150" rx="1050" ry="720" fill="url(#glow)" filter="url(#b16)"/>

  <!-- dune layers, back to front -->
  <path d="M0 730 C 420 640, 800 645, 1160 735 C 1530 828, 1920 802, 2560 660 L2560 1600 L0 1600 Z"
